<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 20px;
    }
    section {
      padding: 40px;
    }
    footer {
      background: #333;
      color: white;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    a {
      color: #4CAF50;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Website</h1>
    <p>Hosted for free on GitHub Pages 🚀</p>
  </header>

  <section>
    <h2>About This Site</h2>
    <p>This is my first free website using GitHub Pages. More content coming soon!</p>
    <p><a href="https://github.com">Visit my GitHub</a></p>
  </section>

  <footer>
    <p>&copy; 2026 My Website | Powered by GitHub Pages</p>
  </footer>
</body>
</html>
